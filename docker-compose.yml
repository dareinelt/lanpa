# Office-Erweiterung (Nextcloud + Euro-Office): Profil "office", Einrichtung
# per Einzeiler ./scripts/office-setup.sh (siehe docs/office.md).
x-nextcloud-env: &nextcloud-env
  POSTGRES_HOST: nextcloud-db
  POSTGRES_DB: nextcloud
  POSTGRES_USER: nextcloud
  POSTGRES_PASSWORD_FILE: /run/secrets/nextcloud_db_password
  NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-ncadmin}
  NEXTCLOUD_ADMIN_PASSWORD_FILE: /run/secrets/nextcloud_admin_password
  NEXTCLOUD_TRUSTED_DOMAINS: nextcloud
  REDIS_HOST: nextcloud-redis
  REDIS_HOST_PASSWORD_FILE: /run/secrets/nextcloud_redis_password
  # Nur der auth-Container (Office-Netz) ist vertrauenswuerdiger Proxy.
  TRUSTED_PROXIES: ${OFFICE_SUBNET:-172.30.250.0/24}
  APACHE_DISABLE_REWRITE_IP: "1"
  OVERWRITECLIURL: ${APP_URL:-http://localhost:8080}/office
  PHP_MEMORY_LIMIT: ${NEXTCLOUD_PHP_MEMORY_LIMIT:-1024M}
  PHP_UPLOAD_LIMIT: ${NEXTCLOUD_UPLOAD_LIMIT:-4G}
  APP_URL: ${APP_URL:-http://localhost:8080}
  EUROOFFICE_JWT_SECRET_FILE: /run/secrets/office_jwt_secret
  EUROOFFICE_JWT_HEADER: AuthorizationJwt
  NEXTCLOUD_EXTRA_TRUSTED_DOMAINS: ${NEXTCLOUD_EXTRA_TRUSTED_DOMAINS:-}
  NEXTCLOUD_OFFICE_GROUPS: ${NEXTCLOUD_OFFICE_GROUPS:-}
  # Apps fuer die lokale KI installieren (aktiviert werden sie vom Intranet).
  NEXTCLOUD_AI_APPS: ${NEXTCLOUD_AI_APPS:-true}
  # Automatische Anmeldung des im Intranet erkannten Benutzers.
  NEXTCLOUD_SSO_LOGIN_REDIRECT: ${NEXTCLOUD_SSO_LOGIN_REDIRECT:-true}
  NEXTCLOUD_SSO_AUTOPROVISION: ${NEXTCLOUD_SSO_AUTOPROVISION:-false}
  # AD-Anbindung (nutzt die bestehenden LDAP_*-Werte des Intranets).
  SSO_ENABLED: ${SSO_ENABLED:-false}
  NEXTCLOUD_LDAP_ENABLED: ${NEXTCLOUD_LDAP_ENABLED:-false}
  NEXTCLOUD_LDAP_PASSWORD_FILE: /run/secrets/nextcloud_ldap_password
  # Verbindungsdaten der Hauptquelle aus der Verwaltung (office-setup.sh);
  # haben Vorrang vor den LDAP_*-Werten unten.
  NEXTCLOUD_LDAP_CONFIG_FILE: /run/secrets/nextcloud_ldap_config
  NEXTCLOUD_LDAP_ALLOWED_GROUPS: ${NEXTCLOUD_LDAP_ALLOWED_GROUPS:-}
  NEXTCLOUD_LDAP_ADMIN_GROUP: ${NEXTCLOUD_LDAP_ADMIN_GROUP:-}
  NEXTCLOUD_LDAP_USER_FILTER: ${NEXTCLOUD_LDAP_USER_FILTER:-}
  NEXTCLOUD_LDAP_GROUP_FILTER: ${NEXTCLOUD_LDAP_GROUP_FILTER:-}
  NEXTCLOUD_LDAP_GROUPS_BASE_DN: ${NEXTCLOUD_LDAP_GROUPS_BASE_DN:-}
  LDAP_HOST: ${LDAP_HOST:-}
  LDAP_PORT: ${LDAP_PORT:-636}
  LDAP_USE_TLS: ${LDAP_USE_TLS:-true}
  LDAP_VERIFY_CERT: ${LDAP_VERIFY_CERT:-true}
  LDAP_BASE_DN: ${LDAP_BASE_DN:-}
  LDAP_BIND_DN: ${LDAP_BIND_DN:-}
  LDAP_GROUP_BASE_DN: ${LDAP_GROUP_BASE_DN:-}
  LDAP_ATTR_SAMACCOUNT_NAME: ${LDAP_ATTR_SAMACCOUNT_NAME:-sAMAccountName}
  LDAP_ATTR_DISPLAY_NAME: ${LDAP_ATTR_DISPLAY_NAME:-displayName}
  LDAP_ATTR_EMAIL: ${LDAP_ATTR_EMAIL:-mail}

x-nextcloud-volumes: &nextcloud-volumes
  - nextcloud_html:/var/www/html
  - nextcloud_data:/var/www/html/data
  # Speicher-Tiering: Kennzeichen ausgelagerter Dateien und Rueckhol-Auftraege
  # (gemeinsam mit storage-sync, siehe docs/storage.md).
  - storage_tiering:/var/lib/lanpa-tiering
  # Werden von hooks/intranet-setup.sh nach config/ bzw. custom_apps/ kopiert
  # (verschachtelte Bind-Mounts wuerden die Verzeichnisse root-eigen machen).
  - ./docker/nextcloud/intranet.config.php:/usr/src/nextcloud/config/intranet.config.php:ro
  - ./docker/nextcloud/apps/intranet_integration:/opt/intranet/intranet_integration:ro

x-nextcloud-secrets: &nextcloud-secrets
  - nextcloud_db_password
  - nextcloud_admin_password
  - nextcloud_redis_password
  - nextcloud_ldap_password
  - nextcloud_ldap_config
  - office_jwt_secret

services:
  db:
    # MySQL 9.7 LTS. Upgrade bestehender 8.0-Datenbestaende: siehe docs/installation.md.
    image: mysql:${DB_IMAGE_TAG:-9.7.2}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-intranet}
      MYSQL_USER: ${DB_USER:-intranet}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD muss in .env gesetzt sein}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD muss in .env gesetzt sein}
    # Pufferpool gross genug fuer das Arbeits-Set der Anwendung waehlen
    # (DB_BUFFER_POOL in .env). Muss in die RAM-Reserve des Hosts passen.
    command:
      - --innodb-buffer-pool-size=${DB_BUFFER_POOL:-1G}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/intranet.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - intranet

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      CONTAINER_ROLE: app
      SEED_ON_START: ${SEED_ON_START:-true}
      # SSO-Header duerfen nur vom vorgelagerten auth-Container stammen.
      SSO_TRUSTED_PROXY: ${SSO_TRUSTED_PROXY:-auth}
      # Gemeinsames Euro-Office-Secret (signierte Diagnose-/Versionsabfragen).
      OFFICE_JWT_SECRET_FILE: /run/secrets/office_jwt_secret
    env_file:
      - .env
    secrets:
      - office_jwt_secret
    volumes:
      - app_storage:/var/www/html/storage
      # KI-Einstellungen fuer Euro-Office (runtime.json, siehe eurooffice).
      - office_ai:/var/www/html/storage/office-ai
      # Token fuer den Abruf der SSO-Konfiguration durch die auth-Container.
      - sso_token:/run/intranet-sso
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/health') !== false ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - intranet
      # Office-Statuspruefung (Nextcloud, DocumentServer, Redis, PostgreSQL).
      - office
      - office_backend
      # SMTP-/IMAP-Proxy fuer Orvanta (nur app <-> mail-proxy).
      - mail_proxy

  mail:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    command: ["php", "scripts/mail_worker.php"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      CONTAINER_ROLE: mail
    env_file:
      - .env
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - intranet

  # Orvanta-Langzeitarchiv: Python-Supervisor steuert den PHP-Archivierungs-
  # Worker (Copy -> Verify -> Commit -> Delete alter E-Mails nach Nextcloud).
  mail-archive:
    build:
      context: .
      dockerfile: docker/mail-archive/Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      CONTAINER_ROLE: mail-archive
      ARCHIVE_POLL_INTERVAL: ${ARCHIVE_POLL_INTERVAL:-3600}
      # Nextcloud-Upload laeuft ueber die signierte Intranet-Integration und
      # braucht dasselbe Euro-Office-Secret wie der app-Container.
      OFFICE_JWT_SECRET_FILE: /run/secrets/office_jwt_secret
    env_file:
      - .env
    secrets:
      - office_jwt_secret
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - intranet
      - office

  # SMTP-/IMAP-Proxy fuer Orvanta-Benutzer ohne Exchange-Postfach
  # (Adminbereich -> Office -> SMTP-/IMAP-Proxy, docs/mail-proxy.md). Nur aus
  # dem internen Netz mail_proxy erreichbar (keine Portfreigabe), ohne
  # Datenbankzugriff. Liest nur den SecretBox-Schluessel (schreibgeschuetzt),
  # um die signierten Anfragen des app-Containers zu pruefen; Postfach-
  # Zugangsdaten kommen pro Anfrage und werden nie gespeichert.
  mail-proxy:
    build:
      context: .
      dockerfile: docker/mail-proxy/Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      MAIL_PROXY_PORT: "8025"
      MAIL_PROXY_KEY_FILE: /run/mail-proxy/keys/secrets.key
      MAIL_PROXY_MAX_CONNECTIONS: ${MAIL_PROXY_MAX_CONNECTIONS:-32}
      MAIL_PROXY_POOL_SIZE: ${MAIL_PROXY_POOL_SIZE:-32}
      MAIL_PROXY_POOL_IDLE_SECONDS: ${MAIL_PROXY_POOL_IDLE_SECONDS:-90}
      MAIL_PROXY_MAX_MESSAGE_MB: ${MAIL_PROXY_MAX_MESSAGE_MB:-35}
      MAIL_PROXY_DENY_CIDRS: ${MAIL_PROXY_DENY_CIDRS:-}
    volumes:
      - type: volume
        source: app_storage
        target: /run/mail-proxy/keys
        read_only: true
        volume:
          subpath: keys
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python3", "/app/mail_proxy.py", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mail_proxy
      # Ausgehende Verbindungen zu den konfigurierten SMTP-/IMAP-Servern.
      - mail_egress

  # Vorgelagerter Authentifizierungs-Container (HTTP Negotiate: Kerberos
  # ueber die Keytab des Computerkontos, sonst NTLM ueber winbind). Reicht
  # den erkannten Benutzer als Header "X-Remote-User" an die Hauptanwendung
  # weiter. Ersetzt den direkten externen Zugriff auf den app-Container.
  auth:
    build:
      context: .
      dockerfile: docker/auth/Dockerfile
    restart: unless-stopped
    # Fester Computername fuer den Domaenenbeitritt (NetBIOS, max. 15 Zeichen);
    # der Beitritt bleibt im Volume sso_samba erhalten.
    hostname: ${SSO_NETBIOS_NAME:-lanpa-sso}
    # Erlaubt dem Container, seine Uhr mit den Zeitservern aus der SSO-
    # Konfiguration (sonst den Domaenencontrollern) zu stellen - Kerberos
    # toleriert hoechstens 5 Minuten Abweichung. Ohne diese Berechtigung wird
    # die Abweichung beim Start nur gemessen und im Protokoll gemeldet.
    cap_add:
      - SYS_TIME
    depends_on:
      app:
        condition: service_healthy
    environment:
      SSO_ENABLED: ${SSO_ENABLED:-false}
      # Domaene, Domaenencontroller und Konto fuer den Domaenenbeitritt werden
      # im Adminbereich gepflegt (verschluesselt gespeichert) und beim Start
      # von der Anwendung abgerufen (/internal/sso-config, Token im Volume
      # sso_token). Die Verteilung auf die Instanzen weiterer Domaenen
      # (scripts/sso-domains.sh) kommt ebenfalls von dort.
      # Reverse-Proxy /office/ und /eurooffice/ (Same-Origin).
      OFFICE_ENABLED: ${OFFICE_ENABLED:-false}
      # Reverse-Proxy fuer LLMInt (KI-Oberflaeche, eigener Stack) unter
      # LLMINT_PATH (Standard /ki/). Gemeinsames Docker-Netz mit LLMInt:
      # docker-compose.llmint.yml (siehe docs/llmint.md).
      LLMINT_ENABLED: ${LLMINT_ENABLED:-false}
      LLMINT_UPSTREAM: ${LLMINT_UPSTREAM:-}
      LLMINT_PATH: ${LLMINT_PATH:-/ki}
      # APP_URL liefert auch den Hostnamen fuer den Kerberos-SPN (HTTP/<host>).

      APP_URL: ${APP_URL:-http://localhost:8080}
      # Kennzahlen fuer das Admin-Dashboard: die Hauptinstanz misst CPU-Last
      # und offene TCP-Verbindungen im Container und meldet sie an
      # POST /internal/auth-metrics (docker/auth/metrics.py, Kachel
      # "Reverse-Proxy"). Abstand in Sekunden.
      AUTH_METRICS_INTERVAL: ${AUTH_METRICS_INTERVAL:-60}
      SSO_REALM: ${SSO_REALM:-}
      SSO_SPN_HOSTS: ${SSO_SPN_HOSTS:-}
      # HTTPS mit dem Zertifikat aus Adminbereich -> Zertifikate (alle 60 s
      # von /internal/tls-config abgeglichen). HTTPS_PUBLIC_PORT = Zielport
      # der Umleitung von HTTP auf HTTPS.
      TLS_ENABLED: ${TLS_ENABLED:-true}
      HTTPS_PUBLIC_PORT: ${APP_HTTPS_PORT:-8443}
    volumes:
      - sso_token:/run/intranet-sso:ro
      - sso_samba:/var/lib/samba
    ports:
      - "${APP_PORT:-8080}:80"
      - "${APP_HTTPS_PORT:-8443}:443"
    networks:
      - intranet
      - office

  sync:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      CONTAINER_ROLE: sync
    env_file:
      - .env
    command: ["php", "scripts/sync_worker.php"]
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - intranet

  # Optionales Verwaltungswerkzeug: docker compose --profile tools up -d
  phpmyadmin:
    image: phpmyadmin:5
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-8081}:80"
    networks:
      - intranet

  # Lokaler KI-Testendpunkt (OpenAI-kompatibel, llama.cpp) fuer die
  # KI-Unterstuetzung in Orvanta: docker compose --profile ki up -d
  # Laedt beim ersten Start ein kleines Modell (ca. 400 MB) von Hugging Face.
  # Anschliessend im Adminbereich unter Office -> Lokale KI eintragen oder
  # per OFFICE_AI_SEED_URL/OFFICE_AI_SEED_MODEL durch scripts/seed.php setzen.
  #ki:
  #  image: ghcr.io/ggml-org/llama.cpp:server
  #  profiles: ["ki"]
  #  restart: unless-stopped
  #  command:
  #    - "--hf-repo"
  #    - "${KI_MODEL_REPO:-Qwen/Qwen2.5-0.5B-Instruct-GGUF}"
  #    - "--hf-file"
  #    - "${KI_MODEL_FILE:-qwen2.5-0.5b-instruct-q4_k_m.gguf}"
  #    - "--alias"
  #    - "${KI_MODEL_ALIAS:-qwen2.5-0.5b-instruct}"
  #    - "--host"
  #    - "0.0.0.0"
  #    - "--port"
  #    - "8080"
  #    - "--ctx-size"
  #    - "4096"
  #    - "--threads"
  #    - "${KI_THREADS:-4}"
  #  environment:
  #    LLAMA_CACHE: /models
  #    # Denkmodelle (z. B. Qwen3.5) antworten ohne "Thinking" deutlich schneller.
  #    LLAMA_ARG_REASONING: "${KI_REASONING:-off}"
  #  volumes:
  #    - ki_models:/models
  #  ports:
  #    - "${KI_PORT:-8089}:8080"
  #  healthcheck:
  #    test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
  #    interval: 30s
  #    timeout: 5s
  #    retries: 20
  #    start_period: 120s
  #  networks:
  #    - intranet

  # SNMP-Agent: Status der Container/Dienste/Workflows per SNMP abfragbar.
  # Liest den Docker-Socket (read-only) und die Datenbank (sync_log) aus.
  snmp:
    build:
      context: .
      dockerfile: docker/snmp/Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      sync:
        condition: service_started
    environment:
      SNMP_COMMUNITY: ${SNMP_COMMUNITY:-public}
      SNMP_SYS_LOCATION: ${SNMP_SYS_LOCATION:-Intranet}
      SNMP_SYS_CONTACT: ${SNMP_SYS_CONTACT:-admin@example.internal}
    env_file:
      - .env
    ports:
      - "${SNMP_PORT:-161}:161/udp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - intranet
      - office

  # ---------------------------------------------------------------------------
  # Office-Erweiterung (Profil "office"): Nextcloud + Euro-Office DocumentServer
  # ---------------------------------------------------------------------------
  nextcloud-db:
    image: postgres:${NEXTCLOUD_DB_IMAGE_TAG:-17.6-alpine}
    profiles: ["office"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD_FILE: /run/secrets/nextcloud_db_password
    secrets:
      - nextcloud_db_password
    volumes:
      - nextcloud_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - office_backend

  nextcloud-redis:
    image: redis:${NEXTCLOUD_REDIS_IMAGE_TAG:-7.4.5-alpine}
    profiles: ["office"]
    restart: unless-stopped
    # Passwort aus dem Secret in eine Konfigurationsdatei (nicht in die Prozessliste).
    command:
      - sh
      - -c
      - umask 077; printf 'requirepass "%s"\nsave ""\nappendonly no\n' "$$(cat /run/secrets/nextcloud_redis_password)" > /tmp/redis.conf; exec redis-server /tmp/redis.conf
    secrets:
      - nextcloud_redis_password
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/nextcloud_redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - office_backend

  nextcloud:
    image: lanpa-nextcloud:${NEXTCLOUD_IMAGE_TAG:-34.0.4-apache}
    build: &nextcloud-build
      context: ./docker/nextcloud
      args:
        NEXTCLOUD_IMAGE_TAG: ${NEXTCLOUD_IMAGE_TAG:-34.0.4-apache}
    profiles: ["office"]
    restart: unless-stopped
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_healthy
    environment: *nextcloud-env
    secrets: *nextcloud-secrets
    volumes:
      - nextcloud_html:/var/www/html
      - nextcloud_data:/var/www/html/data
      - storage_tiering:/var/lib/lanpa-tiering
      - ./docker/nextcloud/intranet.config.php:/usr/src/nextcloud/config/intranet.config.php:ro
      - ./docker/nextcloud/apps/intranet_integration:/opt/intranet/intranet_integration:ro
      - ./docker/nextcloud/apache-office.conf:/etc/apache2/conf-enabled/zz-intranet-office.conf:ro
      - ./docker/nextcloud/hooks/intranet-setup.sh:/docker-entrypoint-hooks.d/post-installation/50-intranet-setup.sh:ro
      - ./docker/nextcloud/hooks/intranet-setup.sh:/docker-entrypoint-hooks.d/before-starting/50-intranet-setup.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Host: nextcloud' http://127.0.0.1/office/status.php | grep -q '\"installed\":true'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    networks:
      - office
      - office_backend

  # Hintergrundjobs von Nextcloud (cron.php alle 5 Minuten).
  nextcloud-cron:
    image: lanpa-nextcloud:${NEXTCLOUD_IMAGE_TAG:-34.0.4-apache}
    build: *nextcloud-build
    profiles: ["office"]
    restart: unless-stopped
    entrypoint: /cron.sh
    depends_on:
      nextcloud:
        condition: service_healthy
    environment: *nextcloud-env
    secrets: *nextcloud-secrets
    volumes: *nextcloud-volumes
    networks:
      - office
      - office_backend

  # Fuehrt KI-Aufgaben von Nextcloud (Assistant) sofort statt nur per Cron aus.
  nextcloud-ai-worker:
    image: lanpa-nextcloud:${NEXTCLOUD_IMAGE_TAG:-34.0.4-apache}
    build: *nextcloud-build
    profiles: ["office"]
    restart: unless-stopped
    user: www-data
    entrypoint: ["/bin/sh", "/opt/intranet/ai-worker.sh"]
    depends_on:
      nextcloud:
        condition: service_healthy
    environment: *nextcloud-env
    secrets: *nextcloud-secrets
    volumes:
      - nextcloud_html:/var/www/html
      - nextcloud_data:/var/www/html/data
      - storage_tiering:/var/lib/lanpa-tiering
      - ./docker/nextcloud/ai-worker.sh:/opt/intranet/ai-worker.sh:ro
    networks:
      - office
      - office_backend

  eurooffice:
    image: ghcr.io/euro-office/documentserver:${EUROOFFICE_IMAGE_TAG:-v9.3.4-hotfix.1}
    profiles: ["office"]
    restart: unless-stopped
    # Das Image liest das JWT-Secret nur aus JWT_SECRET: aus dem Docker-Secret
    # uebernehmen, damit es weder in .env noch in docker inspect steht.
    # Startskript: kopiert das KI-Plugin aus dem AdminPanel nach sdkjs-plugins
    # (EUROOFFICE_AI_PLUGIN=false: nicht anbieten), siehe docs/office.md.
    entrypoint: ["/bin/sh", "/intranet/entrypoint.sh"]
    environment:
      JWT_ENABLED: "true"
      JWT_HEADER: AuthorizationJwt
      JWT_IN_BODY: "true"
      # Nextcloud liegt im internen Docker-Netz (private Adresse).
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      USE_UNAUTHORIZED_STORAGE: "false"
      WOPI_ENABLED: "false"
      EUROOFFICE_AI_PLUGIN: ${EUROOFFICE_AI_PLUGIN:-true}
    secrets:
      - office_jwt_secret
    volumes:
      - eurooffice_data:/var/www/euro-office/Data
      # Lokale KI: Das Intranet schreibt runtime.json (aiSettings), der
      # DocumentServer uebernimmt Aenderungen ohne Neustart.
      - ./docker/eurooffice/entrypoint.sh:/intranet/entrypoint.sh:ro
      - ./docker/eurooffice/local-production-linux.json:/etc/euro-office/documentserver/local-production-linux.json:ro
      - office_ai:/var/lib/intranet-ai:ro
      - eurooffice_db:/var/lib/postgresql
      - eurooffice_logs:/var/log/euro-office
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthcheck | grep -q true"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    networks:
      - office

  # Sicherung/Wiederherstellung der Office-Daten, ausgeloest ueber den
  # Intranet-Adminbereich (Auftragsdatei im gemeinsamen Speicher) oder
  # ./scripts/office-backup.sh. Kein Docker-Socket.
  office-backup:
    build:
      context: .
      dockerfile: docker/office-backup/Dockerfile
    profiles: ["office"]
    restart: unless-stopped
    depends_on:
      nextcloud-db:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-intranet}
      DB_USER: ${DB_USER:-intranet}
      DB_PASSWORD: ${DB_PASSWORD:-}
      OFFICE_BACKUP_RETENTION: ${OFFICE_BACKUP_RETENTION:-7}
      OFFICE_BACKUP_SCHEDULE_HOUR: ${OFFICE_BACKUP_SCHEDULE_HOUR:-}
    secrets:
      - nextcloud_db_password
      - office_backup_passphrase
    volumes:
      - app_storage:/data/intranet-storage
      - nextcloud_html:/data/nextcloud-html
      - nextcloud_data:/data/nextcloud-data
      - eurooffice_data:/data/eurooffice-data
      # Kennzeichen ausgelagerter Dateien (Platzhalter im Hot-Tier) mitsichern.
      - storage_tiering:/data/storage-tiering
      - ${OFFICE_BACKUP_DIR:-./backups}:/backups
    networks:
      - intranet
      - office_backend

  # Katalog des storage-sync-Agenten (Datei-Zustand, Generationen, Schnappschuesse,
  # Schreibereignisse, Aktivitaet). Eigene MySQL-Instanz, damit Tausende
  # Katalog-Schreibvorgaenge pro Sekunde die Anwendungsdatenbank nicht bremsen.
  # Zugangsdaten identisch mit "db" (DB_USER/DB_PASSWORD/DB_ROOT_PASSWORD).
  # Nur im internen Netz storage_catalog erreichbar (siehe docs/storage.md).
  storage-sync-catalog:
    image: mysql:${DB_IMAGE_TAG:-9.7.2}
    profiles: ["office"]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${STORAGE_CATALOG_DB_NAME:-storage_sync}
      MYSQL_USER: ${DB_USER:-intranet}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD muss in .env gesetzt sein}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD muss in .env gesetzt sein}
    command:
      - --innodb-buffer-pool-size=${STORAGE_CATALOG_BUFFER_POOL:-512M}
    volumes:
      - storage_sync_catalog_data:/var/lib/mysql
      - ./docker/storage-sync-catalog/my.cnf:/etc/mysql/conf.d/storage-sync-catalog.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - storage_catalog

  # Hilfsdienst des Katalogs: kurzlebige Sperren (verhindern Deadlocks zwischen
  # Mehrzeilen-Transaktionen) und fluechtige I/O-Zaehler. Haelt keine Wahrheit:
  # ohne Persistenz, ein Ausfall verlangsamt nur (siehe docs/storage.md).
  # Passwort = DB_PASSWORD, ueber eine Konfigurationsdatei (nicht in der Prozessliste).
  storage-sync-redis:
    image: redis:${STORAGE_SYNC_REDIS_IMAGE_TAG:-7.4.5-alpine}
    profiles: ["office"]
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD muss in .env gesetzt sein}
    command:
      - sh
      - -c
      - umask 077; printf 'requirepass "%s"\nsave ""\nappendonly no\nmaxmemory 64mb\nmaxmemory-policy noeviction\n' "$$(printf '%s' "$$REDIS_PASSWORD" | sed 's/[\\"]/\\&/g')" > /tmp/redis.conf; unset REDIS_PASSWORD; exec redis-server /tmp/redis.conf
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - storage_catalog

  # Speicher-Tiering und HA-Synchronisation (Adminbereich -> Speicher (HA)):
  # bindet SMB-Freigaben (UNC) und/oder S3-kompatible Buckets als Cold-Tier
  # ein, haelt dort auf jedem Ziel eine vollstaendige Kopie der Nextcloud- und
  # Euro-Office-Daten (inkl. Datenbanksicherung), lagert selten genutzte
  # Dateien aus dem Hot-Tier (lokales Storage) aus und holt sie bei Zugriff
  # zurueck. Einbinden per mount.cifs bzw. s3fs (FUSE) erfordert
  # CAP_SYS_ADMIN und das Geraet /dev/fuse (nur dieser Container).
  storage-sync:
    build:
      context: .
      dockerfile: docker/storage-sync/Dockerfile
    profiles: ["office"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      nextcloud-db:
        condition: service_healthy
      storage-sync-catalog:
        condition: service_healthy
      storage-sync-redis:
        condition: service_healthy
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    # FUSE fuer S3-Ziele (s3fs): /dev/fuse (c 10:229) legt der Entrypoint an;
    # so startet der Container auch auf Hosts ohne geladenes fuse-Modul.
    device_cgroup_rules:
      - "c 10:229 rwm"
    security_opt:
      - apparmor:unconfined
    tmpfs:
      # Zugangsdateien fuer mount.cifs/s3fs nur im Arbeitsspeicher.
      - /run/storage-sync:mode=0700
    environment:
      CONTAINER_ROLE: storage-sync
      NEXTCLOUD_DB_PASSWORD_FILE: /run/secrets/nextcloud_db_password
    env_file:
      - .env
    secrets:
      - nextcloud_db_password
    volumes:
      # Schluessel fuer die verschluesselten Zugangsdaten der Speicherziele.
      - app_storage:/var/www/html/storage
      - nextcloud_html:/data/nextcloud-html
      - nextcloud_data:/data/nextcloud-data
      - eurooffice_data:/data/eurooffice-data
      - storage_tiering:/var/lib/lanpa-tiering
      - storage_sync_state:/var/lib/storage-sync
    networks:
      - intranet
      - office_backend
      - storage_catalog

volumes:
  db_data:
  ki_models:
  app_storage:
  sso_token:
  sso_samba:
  nextcloud_html:
  nextcloud_data:
  nextcloud_db:
  eurooffice_data:
  eurooffice_db:
  eurooffice_logs:
  office_ai:
  storage_tiering:
  storage_sync_state:
  storage_sync_catalog_data:

networks:
  intranet:
    driver: bridge
  # Oeffentlicher Office-Pfad: auth <-> nextcloud/eurooffice (feste Adressen,
  # damit Nextcloud nur den auth-Container als Proxy vertraut).
  office:
    driver: bridge
    ipam:
      config:
        - subnet: ${OFFICE_SUBNET:-172.30.250.0/24}
  # Datenbank und Redis von Nextcloud: kein Zugang von aussen.
  office_backend:
    driver: bridge
    internal: true
  # app <-> mail-proxy (signierte Anfragen); kein Zugang von aussen.
  mail_proxy:
    driver: bridge
    internal: true
  # Ausgehender Weg des mail-proxy zu den Mailservern (ohne Datenbank/app).
  mail_egress:
    driver: bridge
  # Katalog-Datenbank und Redis von storage-sync: nur storage-sync hat Zugang.
  storage_catalog:
    driver: bridge
    internal: true

# Secrets liegen nach ./scripts/office-setup.sh in ./secrets/ (nicht
# versioniert). Ohne Einrichtung verweisen sie auf leere Platzhalter, damit
# Installationen ohne Office unveraendert starten.
secrets:
  office_jwt_secret:
    file: ${OFFICE_SECRETS_DIR:-./docker/office/unconfigured}/office_jwt_secret
  nextcloud_db_password:
    file: ${OFFICE_SECRETS_DIR:-./docker/office/unconfigured}/nextcloud_db_password
  nextcloud_admin_password:
    file: ${OFFICE_SECRETS_DIR:-./docker/office/unconfigured}/nextcloud_admin_password
  nextcloud_redis_password:
    file: ${OFFICE_SECRETS_DIR:-./docker/office/unconfigured}/nextcloud_redis_password
  nextcloud_ldap_password:
    file: ${OFFICE_SECRETS_DIR:-./docker/office/unconfigured}/nextcloud_ldap_password
  nextcloud_ldap_config:
    file: ${OFFICE_SECRETS_DIR:-./docker/office/unconfigured}/nextcloud_ldap_config
  office_backup_passphrase:
    file: ${OFFICE_SECRETS_DIR:-./docker/office/unconfigured}/office_backup_passphrase
