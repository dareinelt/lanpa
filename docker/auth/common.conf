# Gemeinsamer Inhalt der VirtualHosts (HTTP und HTTPS) des Einstiegs-/
# Authentifizierungs-Containers, eingebunden aus 000-default.conf.
ProxyPreserveHost On
ProxyRequests Off
SetEnvIf Request_URI "^/kaep-dashboard/live$" no-gzip=1

# Eingehende Identitaets-Header werden nie vom Client uebernommen.
RequestHeader unset X-Remote-User early
RequestHeader unset X-Remote-Groups early
RequestHeader unset X-Remote-Source early

# Schema fuer die Anwendung (sichere Cookies, Links). Hinter HAProxy setzt der
# Verteiler den Header (Client-Wert wird dort verworfen).
<IfDefine TLS_APACHE>
    RequestHeader set X-Forwarded-Proto "https" "expr=%{HTTPS} == 'on'"
    RequestHeader set X-Forwarded-Proto "http" "expr=%{HTTPS} != 'on'"
</IfDefine>

<IfDefine SSO_NTLM>
    # Keine Anmeldepflicht: Die Windows-Anmeldung (HTTP Negotiate) wird nur
    # am Anmeldepunkt verlangt. Die Anwendung merkt sich den erkannten
    # Benutzer in der Sitzung; alle anderen Seiten sind ohne Anmeldung
    # erreichbar (oeffentliche Elemente). Browser ohne Domaenenanmeldung
    # erhalten statt einer Anmeldeaufforderung die Seite /sso/nicht-erkannt,
    # die sofort zum Ziel zurueckfuehrt.
    <Location /sso/anmelden>
        AuthName "Intranet"
        AuthType GSSAPI
        <IfDefine SSO_KRB5>
            # Kerberos: Windows-Clients bevorzugen es in SPNEGO; der Browser
            # fordert ein Ticket fuer HTTP/<Hostname der URL> an, dessen
            # Schluessel in der Keytab des Computerkontos liegt.
            GssapiAllowedMech krb5
            GssapiCredStore keytab:${SSO_KRB5_KEYTAB}
        </IfDefine>
        # NTLM-Rueckfall (z. B. Zugriff per IP-Adresse oder ohne Ticket).
        GssapiAllowedMech ntlmssp
        # NTLM ist mehrstufig und an die TCP-Verbindung gebunden.
        GssapiConnectionBound On
        GssapiBasicAuth Off
        Require valid-user
        ErrorDocument 401 /sso/nicht-erkannt
        # Auch bei gestoerter Domaenenanbindung ohne Anmeldung weiter.
        ErrorDocument 500 /sso/nicht-erkannt

        # Identifizierten Benutzer (DOMAIN\SamAccountName bzw. user@REALM)
        # an die Anwendung weiterreichen; die Anwendung normalisiert den Namen.
        RequestHeader set X-Remote-User "expr=%{REMOTE_USER}"

        <IfDefine SSO_WORKER>
            # Identitaetsquelle dieser Instanz (Domaene ohne Vertrauensstellung).
            RequestHeader set X-Remote-Source "${SSO_SOURCE}"
        </IfDefine>
    </Location>

    # Meldung der Netzlaufwerke durch das Anmeldeskript der Clients
    # (scripts/network-drives-report.ps1): Windows-Anmeldung ist hier Pflicht,
    # ohne erkannten Benutzer bleibt es bei 401.
    <Location /sso/laufwerke>
        AuthName "Intranet"
        AuthType GSSAPI
        <IfDefine SSO_KRB5>
            GssapiAllowedMech krb5
            GssapiCredStore keytab:${SSO_KRB5_KEYTAB}
        </IfDefine>
        GssapiAllowedMech ntlmssp
        GssapiConnectionBound On
        GssapiBasicAuth Off
        Require valid-user
        RequestHeader set X-Remote-User "expr=%{REMOTE_USER}"
        <IfDefine SSO_WORKER>
            RequestHeader set X-Remote-Source "${SSO_SOURCE}"
        </IfDefine>
    </Location>

    # AD-Gruppen werden nicht per Header uebergeben: Die Anwendung ermittelt
    # sie aus der AD-Synchronisation (Gruppen-Pfad in der AD-Konfiguration).
</IfDefine>

# Healthcheck des Containers selbst (ohne Anmeldung, ohne Inhalte).
<Location /auth-health>
    <IfDefine SSO_NTLM>
        AuthType None
    </IfDefine>
    Require all granted
    ProxyPass "!"
</Location>
RewriteEngine On
RewriteRule ^/auth-health$ - [R=204,L]

# Kennzahlen der Karte "Reverse-Proxy" (docker/auth/metrics.py): eine Zeile je
# Anfrage mit der Client-Adresse und ihrem Quellport, damit der auth-Container
# im Messfenster sowohl die aufgebauten Verbindungen (Adresse + Quellport) als
# auch die Anfragen je Quellnetz zaehlen kann. metrics.py liest die Datei bei
# jeder Probe und leert sie danach; der eigene Healthcheck des Containers
# bleibt aussen vor. Nur die Hauptinstanz meldet Kennzahlen (-D AUTH_METRICS).
<IfDefine AUTH_METRICS>
    SetEnvIf Request_URI "^/auth-health$" metrics_healthcheck
    CustomLog /var/log/apache2/intranet-metrics.log "%h %{remote}p" env=!metrics_healthcheck
</IfDefine>
# Interne Schnittstellen der Anwendung (z. B. /internal/sso-config) sind
# nur direkt aus den Containern erreichbar, nie ueber diesen Proxy.
RewriteRule ^/internal(/|$) - [R=404,L]

# Reverse-Proxy fuer Euro-Office (Nextcloud + DocumentServer).
<IfDefine OFFICE>
    Include /etc/apache2/intranet/office.conf
</IfDefine>

# Reverse-Proxy fuer LLMInt (KI-Oberflaeche) unter LLMINT_PATH (Standard /ki/).
<IfDefine LLMINT>
    Include /etc/apache2/intranet/llmint.conf
</IfDefine>

# Weiterleitung von Navigationskacheln ueber diesen Proxy (Adressraum
# /weiterleitung/<id>/). Die Datei wird von weiterleitung-sync.sh aus den
# Zielen erzeugt, die im Adminbereich der Anwendung gepflegt werden; sie ist
# auch leer vorhanden (leerer Adressraum, Hinweisseite). Sie muss vor dem
# Auffang-ProxyPass stehen, damit ihre <Location>-Bloecke greifen.
IncludeOptional /etc/apache2/intranet/weiterleitung.conf

# Anwendung (Intranet) und alle uebrigen Pfade.
#
# X-Forwarded-For: mod_proxy (ProxyAddHeaders On, Vorgabe) haengt an eine vom
# Client mitgeschickte Liste die Adresse des direkten Gegenuebers an. Die
# Anwendung wertet deshalb nur den LETZTEN Eintrag aus (Request::clientIp());
# Werte davor sind frei waehlbar. Kommt davor ein weiterer Verteiler zum
# Einsatz, muss er die Anfrage ohne eigenen X-Forwarded-For-Kopf weitergeben,
# damit dort die Client-Adresse steht.
ProxyPass / http://app/
ProxyPassReverse / http://app/
