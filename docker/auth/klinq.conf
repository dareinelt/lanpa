# Reverse-Proxy fuer KLINQ (nur mit "-D KLINQ", KLINQ_ENABLED=true).
#
#   /klinq/  ->  klinq-app/   (KLINQ unter dem Unterpfad /klinq)
#
# KLINQ arbeitet intern durchgehend mit seinen eigenen Pfaden (/dashboard,
# /api/...). Der Unterpfad wird deshalb hier entfernt und vom KLINQ-Container
# in den Antworten wieder ergaenzt (KLINQ_BASE_PATH=/klinq, siehe
# klinq/docker/php/apache-vhost.conf). Damit liegt KLINQ wie Office auf dem
# Host des Intranets (Same-Origin) und benoetigt kein eigenes Zertifikat.
#
# Die Windows-Anmeldung ist auf allen KLINQ-Pfaden Pflicht: KLINQ bringt keine
# eigene Kerberos-/AD-Anbindung mehr mit. Der erkannte Benutzer wird als
# X-Remote-User uebergeben; Rollen und Berechtigungsgruppen kommen aus dem
# signierten Einstiegsschein des Intranets (/klinq-starten -> /klinq/sso/lanpa).
#
# Der Container-Hostname wird erst bei der ersten Anfrage aufgeloest; ist KLINQ
# nicht gestartet, liefert Apache 503 und leitet intern auf die verstaendliche
# Hinweisseite der Intranet-Anwendung um (backend-watch.sh laedt Apache neu,
# wenn ein Container mit neuer Adresse erstellt wurde).

# mod_rewrite statt mod_alias, weil "ProxyPass /" vor mod_alias greift.
RewriteRule ^/klinq$ /klinq/ [R=301,L]

# Die Anmeldung selbst uebernimmt das Intranet: Die lokale Anmeldemaske von
# KLINQ wird nicht angeboten, der Weg fuehrt ueber den SSO-Einstieg.
RewriteRule ^/klinq/login/?$ /klinq-starten [R=302,L]

# Die Hinweisseite "KLINQ nicht verfuegbar" (Ziel der ErrorDocuments) ist ohne
# NTLM-Handshake erreichbar.
<LocationMatch "^/klinq-nicht-verfuegbar$">
    <IfDefine SSO_NTLM>
        AuthType None
    </IfDefine>
    Require all granted
</LocationMatch>

<Location /klinq/>
    <IfDefine SSO_NTLM>
        AuthName "Intranet"
        AuthType GSSAPI
        <IfDefine SSO_KRB5>
            GssapiAllowedMech krb5
            GssapiCredStore keytab:${SSO_KRB5_KEYTAB}
        </IfDefine>
        GssapiAllowedMech ntlmssp
        GssapiConnectionBound On
        GssapiBasicAuth Off
        Require valid-user
        # Ohne Domaenenanmeldung zurueck zur Hinweisseite des Intranets.
        ErrorDocument 401 /sso/nicht-erkannt
        RequestHeader set X-Remote-User "expr=%{REMOTE_USER}"
        <IfDefine SSO_WORKER>
            RequestHeader set X-Remote-Source "${SSO_SOURCE}"
        </IfDefine>
    </IfDefine>
    <IfDefine !SSO_NTLM>
        Require all granted
    </IfDefine>

    ProxyPass http://klinq-app/ timeout=300 retry=5
    ProxyPassReverse http://klinq-app/
    <IfDefine !TLS_APACHE>
        <IfDefine !TLS_PROXY>
            RequestHeader set X-Forwarded-Proto "${OFFICE_PUBLIC_SCHEME}"
        </IfDefine>
    </IfDefine>

    # 500: Container nicht aufloesbar (KLINQ gestoppt); Fehlerseiten von KLINQ
    # selbst werden unveraendert durchgereicht (ProxyErrorOverride Off).
    ErrorDocument 500 /klinq-nicht-verfuegbar
    ErrorDocument 502 /klinq-nicht-verfuegbar
    ErrorDocument 503 /klinq-nicht-verfuegbar
</Location>
