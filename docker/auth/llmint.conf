# Reverse-Proxy fuer LLMInt (KI-Oberflaeche, eigener Compose-Stack) unter
# einem Unterpfad (nur mit "-D LLMINT", LLMINT_ENABLED=true).
#
#   ${LLMINT_PATH}/ -> ${LLMINT_UPSTREAM}/   (Pfadpraefix wird entfernt)
#
# LLMINT_PATH (Standard /ki) und LLMINT_UPSTREAM (z. B. http://llmint-web ueber
# das gemeinsame Docker-Netz llmint-proxy oder http://10.0.0.5:8080) prueft
# entrypoint.sh. LLMInt liegt damit im selben Origin wie das Intranet und
# nutzt dessen HTTPS-Zertifikat.
#
# An LLMInt gehen X-Forwarded-Proto (wie office.conf), X-Forwarded-Host und
# X-Forwarded-For (von mod_proxy neu gesetzt, Werte des Clients werden
# verworfen) sowie X-Forwarded-Prefix. X-Remote-User setzt nur der
# SSO-Einstiegspunkt ${LLMINT_PATH}/sso.php (Windows-Anmeldung wie
# /sso/anmelden); LLMInt darf ihn nur von diesem Proxy annehmen
# (TRUSTED_PROXIES).
#
# Ist LLMInt nicht erreichbar, erscheint die Hinweisseite
# /ki-nicht-verfuegbar der Intranet-Anwendung. backend-watch.sh laedt Apache
# neu, wenn ein Container-Hostname als Upstream eine neue Adresse erhaelt.

<IfDefine LLMINT_TLS>
    # Upstream per HTTPS: Zertifikat gegen die System-CAs pruefen.
    SSLProxyEngine On
    SSLProxyVerify require
    SSLProxyCACertificateFile /etc/ssl/certs/ca-certificates.crt
    SSLProxyCheckPeerName On
</IfDefine>

# mod_rewrite statt mod_alias, weil "ProxyPass /" vor mod_alias greift.
RewriteRule ^${LLMINT_PATH}$ ${LLMINT_PATH}/ [R=301,L]

# Weiterleitung und Hinweisseite (Ziel der ErrorDocuments) sind ohne
# NTLM-Handshake erreichbar.
<LocationMatch "^(${LLMINT_PATH}|/ki-nicht-verfuegbar)$">
    <IfDefine SSO_NTLM>
        AuthType None
    </IfDefine>
    Require all granted
</LocationMatch>

<Location ${LLMINT_PATH}/>
    <IfDefine SSO_NTLM>
        # LLMInt verwaltet seine Sitzung selbst; die Windows-Anmeldung wird
        # nur am SSO-Einstiegspunkt (sso.php, siehe unten) verlangt.
        AuthType None
    </IfDefine>
    Require all granted

    # Antworten werden per Server-Sent Events gestreamt: nicht komprimieren
    # (mod_deflate puffert sonst) und jedes Paket sofort weitergeben.
    # Uploads bis 100 MB und lange Antworten: timeout=3600.
    SetEnv no-gzip 1
    ProxyPass ${LLMINT_UPSTREAM}/ timeout=3600 flushpackets=on retry=5
    ProxyPassReverse ${LLMINT_UPSTREAM}/
    # LLMInt setzt Cookies fuer "/" (Webroot im Container).
    ProxyPassReverseCookiePath / ${LLMINT_PATH}/

    # Weitergereichte Werte des Clients verwerfen; mod_proxy setzt
    # X-Forwarded-For/-Host/-Server danach neu (ProxyAddHeaders On).
    ProxyAddHeaders On
    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Forwarded-Server
    RequestHeader set X-Forwarded-Prefix "${LLMINT_PATH}"
    <IfDefine !TLS_APACHE>
        <IfDefine !TLS_PROXY>
            RequestHeader set X-Forwarded-Proto "${OFFICE_PUBLIC_SCHEME}"
        </IfDefine>
    </IfDefine>
    RequestHeader unset X-Remote-User
    RequestHeader unset X-Remote-Source

    # 500: Upstream nicht aufloesbar (LLMInt gestoppt); Fehlerseiten von
    # LLMInt selbst werden unveraendert durchgereicht (ProxyErrorOverride Off).
    ErrorDocument 500 /ki-nicht-verfuegbar
    ErrorDocument 502 /ki-nicht-verfuegbar
    ErrorDocument 503 /ki-nicht-verfuegbar
</Location>

# SSO-Einstiegspunkt von LLMInt. Dieser Abschnitt muss nach
# <Location ${LLMINT_PATH}/> stehen: seine Header-Anweisungen werden nach
# denen des uebergeordneten Abschnitts ausgefuehrt (unset, dann set).
<IfDefine SSO_NTLM>
<IfDefine !SSO_WORKER>
    # Automatische Windows-Anmeldung wie /sso/anmelden (Kerberos/NTLM).
    # Browser ohne Domaenenanmeldung bzw. bei gestoerter Domaenenanbindung
    # erhalten die Fallback-Seite von LLMInt, die per Meta-Refresh zur
    # Zielseite zurueckfuehrt (LLMInt zeigt dann das Anmeldeformular).
    <Location ${LLMINT_PATH}/sso.php>
        AuthName "Intranet"
        AuthType GSSAPI
        <IfDefine SSO_KRB5>
            GssapiAllowedMech krb5
            GssapiCredStore keytab:${SSO_KRB5_KEYTAB}
        </IfDefine>
        GssapiAllowedMech ntlmssp
        GssapiConnectionBound On
        GssapiBasicAuth Off
        Require valid-user
        ErrorDocument 401 ${LLMINT_PATH}/sso_fallback.php
        ErrorDocument 500 ${LLMINT_PATH}/sso_fallback.php

        # DOMAIN\SamAccountName bzw. user@REALM; LLMInt normalisiert.
        RequestHeader set X-Remote-User "expr=%{REMOTE_USER}"
    </Location>
</IfDefine>
</IfDefine>
# Instanzen weiterer Identitaetsquellen (SSO_WORKER): sso.php wird ohne
# Anmeldung und ohne X-Remote-User durchgereicht (Konten anderer Domaenen
# wuerden sonst gleichnamige Konten der Hauptdomaene treffen); LLMInt
# faellt dann auf sein Anmeldeformular zurueck.
