# Apache-VirtualHost des Einstiegs-/Authentifizierungs-Containers.
#
# Kein Kerberos: Die Anmeldung erfolgt ausschliesslich ueber NTLM (HTTP
# Negotiate) mittels mod_auth_gssapi + gss-ntlmssp + winbind. Aktiv nur mit
# "-D SSO_NTLM" (SSO_ENABLED=true, siehe entrypoint.sh).
#
# Instanzen weiterer Identitaetsquellen ("-D SSO_WORKER", SSO_SOURCE) pruefen
# gegen ihre eigene Domaene und kennzeichnen die Anfrage mit dem Header
# "X-Remote-Source: <KENNUNG>"; die Hauptinstanz setzt diesen Header nie.

<IfDefine PROXY_PROTOCOL>
    # Hinter dem HAProxy-Verteiler: echte Client-Adresse per PROXY-Protokoll.
    RemoteIPProxyProtocol On
    <IfDefine !SSO_ROUTER>
        # Instanz weiterer Quelle: der lokale Healthcheck spricht ohne
        # PROXY-Protokoll. (In der Hauptinstanz kommt HAProxy selbst von
        # 127.0.0.1; der Healthcheck laeuft dort ueber HAProxy.)
        RemoteIPProxyProtocolExceptions 127.0.0.1 ::1
    </IfDefine>
</IfDefine>

<VirtualHost *:${AUTH_HTTP_PORT}>
    ServerName localhost

    ProxyPreserveHost On
    ProxyRequests Off

    # Eingehende Identitaets-Header werden nie vom Client uebernommen.
    RequestHeader unset X-Remote-User early
    RequestHeader unset X-Remote-Groups early
    RequestHeader unset X-Remote-Source early

    <IfDefine SSO_NTLM>
        # Keine Anmeldepflicht: NTLM wird nur am Anmeldepunkt verlangt. Die
        # Anwendung merkt sich den erkannten Benutzer in der Sitzung; alle
        # anderen Seiten sind ohne Anmeldung erreichbar (oeffentliche
        # Elemente). Browser ohne Domaenenanmeldung erhalten statt einer
        # Anmeldeaufforderung die Seite /sso/nicht-erkannt, die sofort zum
        # Ziel zurueckfuehrt.
        <Location /sso/anmelden>
            AuthName "Intranet"
            AuthType GSSAPI
            GssapiAllowedMech ntlmssp
            # NTLM ist mehrstufig und an die TCP-Verbindung gebunden.
            GssapiConnectionBound On
            GssapiBasicAuth Off
            Require valid-user
            ErrorDocument 401 /sso/nicht-erkannt
            # Auch bei gestoerter Domaenenanbindung ohne Anmeldung weiter.
            ErrorDocument 500 /sso/nicht-erkannt

            # Identifizierten Benutzer (DOMAIN\SamAccountName) an die Anwendung
            # weiterreichen; die Anwendung normalisiert den Namen.
            RequestHeader set X-Remote-User "expr=%{REMOTE_USER}"

            <IfDefine SSO_WORKER>
                # Identitaetsquelle dieser Instanz (Domaene ohne Vertrauensstellung).
                RequestHeader set X-Remote-Source "${SSO_SOURCE}"
            </IfDefine>
        </Location>

        # AD-Gruppen werden nicht per Header uebergeben: Die Anwendung ermittelt
        # sie aus der AD-Synchronisation (Gruppen-Pfad in der AD-Konfiguration).
    </IfDefine>

    # Healthcheck des Containers selbst (ohne Anmeldung, ohne Inhalte).
    <Location /auth-health>
        <IfDefine SSO_NTLM>
            AuthType None
        </IfDefine>
        Require all granted
        ProxyPass "!"
    </Location>
    RewriteEngine On
    RewriteRule ^/auth-health$ - [R=204,L]
    # Interne Schnittstellen der Anwendung (z. B. /internal/sso-config) sind
    # nur direkt aus den Containern erreichbar, nie ueber diesen Proxy.
    RewriteRule ^/internal(/|$) - [R=404,L]

    # Reverse-Proxy fuer Euro-Office (Nextcloud + DocumentServer).
    <IfDefine OFFICE>
        Include /etc/apache2/intranet/office.conf
    </IfDefine>

    ProxyPass / http://app/
    ProxyPassReverse / http://app/
</VirtualHost>
