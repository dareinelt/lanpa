# Apache-VirtualHost des Einstiegs-/Authentifizierungs-Containers.
#
# Kein Kerberos: Die Anmeldung erfolgt ausschliesslich ueber NTLM (HTTP
# Negotiate) mittels mod_auth_gssapi + gss-ntlmssp + winbind. Aktiv nur mit
# "-D SSO_NTLM" (SSO_ENABLED=true, siehe entrypoint.sh).
<VirtualHost *:80>
    ServerName localhost

    ProxyPreserveHost On
    ProxyRequests Off

    # Eingehende Identitaets-Header werden nie vom Client uebernommen.
    RequestHeader unset X-Remote-User early
    RequestHeader unset X-Remote-Groups early

    <IfDefine SSO_NTLM>
        # NTLM-Handshake fuer alle Anfragen an die Intranet-Anwendung.
        <Location />
            AuthName "Intranet"
            AuthType GSSAPI
            GssapiAllowedMech ntlmssp
            # NTLM ist mehrstufig und an die TCP-Verbindung gebunden.
            GssapiConnectionBound On
            GssapiBasicAuth Off
            Require valid-user
        </Location>

        # Identifizierten Benutzer (DOMAIN\SamAccountName) an die Anwendung
        # weiterreichen; die Anwendung normalisiert den Namen.
        RequestHeader set X-Remote-User "expr=%{REMOTE_USER}"

        # AD-Gruppen werden nicht per Header uebergeben: Die Anwendung ermittelt
        # sie aus der AD-Synchronisation (Gruppen-Pfad in der AD-Konfiguration).
    </IfDefine>

    # Healthcheck des Containers selbst (ohne Anmeldung, ohne Inhalte).
    <Location /auth-health>
        <IfDefine SSO_NTLM>
            AuthType None
        </IfDefine>
        Require all granted
        ProxyPass "!"
    </Location>
    RewriteEngine On
    RewriteRule ^/auth-health$ - [R=204,L]

    # Reverse-Proxy fuer Euro-Office (Nextcloud + DocumentServer).
    <IfDefine OFFICE>
        Include /etc/apache2/intranet/office.conf
    </IfDefine>

    ProxyPass / http://app/
    ProxyPassReverse / http://app/
</VirtualHost>
