# Apache-VirtualHost des Einstiegs-/Authentifizierungs-Containers.
#
# Kein Kerberos: Die Anmeldung erfolgt ausschliesslich ueber NTLM (HTTP
# Negotiate) mittels mod_auth_gssapi + gss-ntlmssp + winbind. Aktiv nur mit
# "-D SSO_NTLM" (SSO_ENABLED=true, siehe entrypoint.sh).
#
# Instanzen weiterer Identitaetsquellen ("-D SSO_WORKER", SSO_SOURCE) pruefen
# gegen ihre eigene Domaene und kennzeichnen die Anfrage mit dem Header
# "X-Remote-Source: <KENNUNG>"; die Hauptinstanz setzt diesen Header nie.

<IfDefine PROXY_PROTOCOL>
    # Hinter dem HAProxy-Verteiler: echte Client-Adresse per PROXY-Protokoll.
    RemoteIPProxyProtocol On
    <IfDefine !SSO_ROUTER>
        # Instanz weiterer Quelle: der lokale Healthcheck spricht ohne
        # PROXY-Protokoll. (In der Hauptinstanz kommt HAProxy selbst von
        # 127.0.0.1; der Healthcheck laeuft dort ueber HAProxy.)
        RemoteIPProxyProtocolExceptions 127.0.0.1 ::1
    </IfDefine>
</IfDefine>

<VirtualHost *:${AUTH_HTTP_PORT}>
    ServerName localhost

    # HTTPS-Richtlinie (Umleitung auf HTTPS bzw. HTTP nur aus freigegebenen
    # Quellnetzen), erzeugt von tls-sync.sh aus der Zertifikatsverwaltung.
    <IfDefine TLS_APACHE>
        IncludeOptional /etc/apache2/intranet/http-policy.conf
    </IfDefine>

    Include /etc/apache2/intranet/common.conf
</VirtualHost>

# HTTPS (nur Einzelinstanz; mit Verteiler terminiert HAProxy TLS). Zertifikat
# und Schluessel stammen aus der Zertifikatsverwaltung im Adminbereich
# (bzw. dem selbstsignierten Notfall-Zertifikat), siehe tls-sync.sh.
<IfDefine TLS_APACHE>
    <VirtualHost *:443>
        ServerName localhost

        SSLEngine on
        SSLCertificateFile /etc/intranet-tls/cert.pem
        SSLCertificateKeyFile /etc/intranet-tls/key.pem
        SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
        SSLHonorCipherOrder off
        SSLSessionTickets off

        Include /etc/apache2/intranet/common.conf
    </VirtualHost>
</IfDefine>
