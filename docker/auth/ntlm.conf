# Apache-VirtualHost fuer den NTLM-Authentifizierungs-Container.
# Kein Kerberos: Die Authentifizierung erfolgt ausschliesslich ueber NTLM
# (HTTP Negotiate) mittels winbind-Helper.
<VirtualHost *:80>
    ServerName localhost

    # NTLM-Handshake fuer alle Anfragen.
    <Location />
        AuthName "Intranet"
        AuthType NTLM
        NTLMAuth on
        NTLMAuthHelper "/usr/bin/ntlm_auth --helper-protocol=squid-2.5-ntlmssp"
        NTLMBasicAuthoritative on
        Require valid-user
    </Location>

    # Identifizierten Benutzer (SamAccountName) an die Anwendung weiterreichen.
    RequestHeader set X-Remote-User "expr=%{REMOTE_USER}"

    # Optionale Weitergabe von AD-Gruppen. Aktivieren, wenn die Anwendung
    # gruppenbasierte Berechtigungen auswerten soll, und die Gruppen aus einer
    # vertrauenswuerdigen Quelle (z. B. einem Reverse-Proxy-Modul) stammen.
    # RequestHeader set X-Remote-Groups "expr=%{REMOTE_USER}"

    ProxyPreserveHost On
    ProxyPass / http://app/
    ProxyPassReverse / http://app/
</VirtualHost>
