# Reverse-Proxy fuer Euro-Office (nur mit "-D OFFICE", OFFICE_ENABLED=true).
#
# X-Forwarded-Proto: mit eigenem TLS (TLS_APACHE) setzt common.conf den Wert
# je Verbindung, mit TLS im Verteiler (TLS_PROXY) HAProxy, sonst gilt
# das Schema aus APP_URL (externer TLS-Proxy).
#
#   /office/      -> nextcloud:80/office/   (Nextcloud inkl. Euro-Office-Connector)
#   /eurooffice/  -> eurooffice:80/         (Euro-Office DocumentServer, WebSockets)
#
# Beide Pfade liegen auf demselben Host wie das Intranet (Same-Origin). Es wird
# kein iframe um Nextcloud gelegt und keine Sicherheitsrichtlinie abgeschwaecht.
#
# Die Container-Hostnamen werden erst bei der ersten Anfrage aufgeloest; ist
# Office nicht gestartet, liefert Apache 503 und leitet intern auf die
# verstaendliche Hinweisseite der Intranet-Anwendung um.

# mod_rewrite statt mod_alias, weil "ProxyPass /" vor mod_alias greift.
RewriteRule ^/(office|eurooffice)$ /$1/ [R=301,L]

# Weiterleitungen und die Hinweisseite "Office nicht verfuegbar" (Ziel der
# ErrorDocuments) sind ohne NTLM-Handshake erreichbar.
<LocationMatch "^/(office|eurooffice|office-nicht-verfuegbar)$">
    <IfDefine SSO_NTLM>
        AuthType None
    </IfDefine>
    Require all granted
</LocationMatch>

<Location /office/>
    <IfDefine SSO_NTLM>
        # Nextcloud authentifiziert selbst (LDAP/AD); NTLM wuerde WebDAV,
        # Desktop-/Mobil-Clients und Freigabelinks stoeren.
        AuthType None
    </IfDefine>
    Require all granted

    ProxyPass http://nextcloud/office/ timeout=3600 retry=5
    ProxyPassReverse http://nextcloud/office/
    <IfDefine !TLS_APACHE>
        <IfDefine !TLS_PROXY>
            RequestHeader set X-Forwarded-Proto "${OFFICE_PUBLIC_SCHEME}"
        </IfDefine>
    </IfDefine>
    RequestHeader unset X-Remote-User

    # 500: Container nicht aufloesbar (Office gestoppt); Fehlerseiten von
    # Nextcloud selbst werden unveraendert durchgereicht (ProxyErrorOverride Off).
    ErrorDocument 500 /office-nicht-verfuegbar
    ErrorDocument 502 /office-nicht-verfuegbar
    ErrorDocument 503 /office-nicht-verfuegbar
</Location>

<Location /eurooffice/>
    <IfDefine SSO_NTLM>
        AuthType None
    </IfDefine>
    Require all granted

    # Virtueller Pfad: der DocumentServer erzeugt seine URLs aus
    # X-Forwarded-Host (inkl. Pfad) und X-Forwarded-Proto.
    ProxyAddHeaders Off
    ProxyPass http://eurooffice/ upgrade=websocket timeout=3600 retry=5
    ProxyPassReverse http://eurooffice/
    RequestHeader set X-Forwarded-Host "expr=%{HTTP_HOST}/eurooffice"
    <IfDefine !TLS_APACHE>
        <IfDefine !TLS_PROXY>
            RequestHeader set X-Forwarded-Proto "${OFFICE_PUBLIC_SCHEME}"
        </IfDefine>
    </IfDefine>
    RequestHeader set X-Forwarded-For "expr=%{REMOTE_ADDR}"
    RequestHeader unset X-Remote-User

    # 500: Container nicht aufloesbar (Office gestoppt); Fehlerseiten von
    # Nextcloud selbst werden unveraendert durchgereicht (ProxyErrorOverride Off).
    ErrorDocument 500 /office-nicht-verfuegbar
    ErrorDocument 502 /office-nicht-verfuegbar
    ErrorDocument 503 /office-nicht-verfuegbar
</Location>

# Die Editor-Seiten des DocumentServers referenzieren dieses Skript mit so
# vielen "../", dass der Pfad oberhalb von /eurooffice/ landet. Nur diese
# eine Datei wird deshalb zusaetzlich an den DocumentServer durchgereicht.
<Location /sdkjs/common/device_scale.js>
    <IfDefine SSO_NTLM>
        AuthType None
    </IfDefine>
    Require all granted
    ProxyPass http://eurooffice/sdkjs/common/device_scale.js retry=5
    RequestHeader unset X-Remote-User
</Location>

<IfDefine SSO_WORKER>
    # Instanzen weiterer Identitaetsquellen: Die direkte Windows-Anmeldung
    # an Nextcloud (user_saml) ordnet nur den SamAccountName zu und wuerde
    # gleichnamige Konten der Hauptquelle treffen. Sie bleibt deshalb
    # gesperrt; die Anmeldung erfolgt ueber die Office-Kachel des Intranets
    # (signiertes Token mit "name@kennung") oder das Anmeldeformular.
    <LocationMatch "^/office/(index\.php/)?apps/user_saml/saml/login">
        <IfDefine SSO_NTLM>
            AuthType None
        </IfDefine>
        Require all denied
    </LocationMatch>
</IfDefine>

<IfDefine SSO_NTLM>
<IfDefine !SSO_WORKER>
    # Automatische Windows-Anmeldung an Nextcloud: Nur der SSO-Einstiegspunkt
    # der Nextcloud-App "user_saml" (Modus "Umgebungsvariable") verlangt NTLM.
    # Der hier ermittelte SamAccountName wird als X-Remote-User uebergeben;
    # Nextcloud prueft, dass das Konto im AD (user_ldap) existiert.
    <LocationMatch "^/office/(index\.php/)?apps/user_saml/saml/login">
        AuthName "Intranet"
        AuthType GSSAPI
        GssapiAllowedMech ntlmssp
        GssapiConnectionBound On
        GssapiBasicAuth Off
        Require valid-user
        RequestHeader set X-Remote-User "expr=%{REMOTE_USER}"
    </LocationMatch>
</IfDefine>
</IfDefine>
