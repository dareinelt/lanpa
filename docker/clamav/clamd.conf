# clamd-Konfiguration fuer den clamav-Container (Malware-Protection).
# Die Anwendung spricht clamd ueber TCP an (Host/Port aus CLAMAV_HOST/CLAMAV_PORT),
# der lokale Socket dient nur freshclam (NotifyClamd) und dem Healthcheck
# (clamdscan --ping). Siehe docs/malware-protection.md.

LocalSocket /run/clamav/clamd.sock
LocalSocketMode 660

# Erreichbar nur aus dem internen Docker-Netz; es wird kein Port veroeffentlicht.
TCPSocket 3310
TCPAddr 0.0.0.0

DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp

# Im Container laeuft clamd im Vordergrund und protokolliert auf die
# Container-Ausgabe (docker compose logs clamav). Bewusst ohne LogFile: clamd
# kann "/dev/stdout" nicht oeffnen (das Geraet ist im Container ein Symlink auf
# den eigenen Dateideskriptor), im Vordergrund schreibt es ohne LogFile direkt
# auf die Ausgabe.
Foreground yes
LogTime yes
LogClean no
LogVerbose no
Debug no

# clamd startet als root und wechselt danach auf den Benutzer clamav.
User clamav
PidFile /run/clamav/clamd.pid

# Obergrenze fuer einen einzelnen INSTREAM-Aufruf. Muss mindestens so gross sein
# wie der groesste zu pruefende Anhang (Malware-Protection: malware_max_bytes).
# Wird beim Start aus CLAMAV_MAX_STREAM_LENGTH gesetzt.
StreamMaxLength 100M

# Zeitlimits: grosse Archive brauchen laenger als der Vorgabewert von 120 s.
ReadTimeout 300
MaxThreads 8
MaxConnectionQueueLength 30

# Analyseumfang: deckt typische Anhaenge (Office, PDF, Archive) ab. Beide
# Werte werden beim Start wie StreamMaxLength aus CLAMAV_MAX_STREAM_LENGTH
# gesetzt, damit jeder angenommene Stream auch vollstaendig geprueft wird.
MaxScanSize 100M
MaxFileSize 100M
MaxRecursion 10
MaxEmbeddedPE 20M
MaxHTMLNormalize 10M
MaxZipTypeRcg 1M

# Keine potentiell unerwuenschten Programme (Adware/Toolbars) - die Anwendung
# unterscheidet nicht zwischen Virus und PUA.
DetectPUA no

# Keine Selbstpruefung/Quarantaene: befundete Dateien werden nicht gespeichert,
# sondern nur gemeldet; die Bewertung erfolgt in der Anwendung.
ScanPE yes
ScanELF no
ScanMail yes
ScanArchive yes

# Nicht vollstaendig pruefbare Inhalte als Befund melden statt als "OK":
# Ueberschreitung der Grenzen (Groesse, Verschachtelung, Anzahl Dateien in
# Archiven) liefert "Heuristics.Limits.Exceeded.*", verschluesselte Archive
# und Dokumente "Heuristics.Encrypted.*". Die Administration kann solche
# Anhaenge nach Pruefung freigeben.
AlertExceedsMax yes
AlertEncrypted yes
