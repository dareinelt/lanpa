# freshclam-Konfiguration fuer den clamav-Container (Malware-Protection).
# Der Aktualisierungs-Daemon laeuft im Hintergrund und haelt die
# Signaturdatenbank in /var/lib/clamav aktuell; den Updatestand zeigt der
# Adminbereich unter System -> Malware-Protection an.
# Siehe docs/malware-protection.md.

DatabaseDirectory /var/lib/clamav

# Protokoll auf die Container-Ausgabe (docker compose logs clamav). Bewusst
# ohne UpdateLogFile: freshclam kann "/dev/stdout" nicht oeffnen (das Geraet ist
# im Container ein Symlink auf den eigenen Dateideskriptor); der Start erfolgt
# stattdessen mit der Option --stdout (siehe entrypoint.sh).
LogTime yes

DatabaseMirror database.clamav.net
DatabaseMirror db.de.clamav.net

# Pruefintervall in Stunden. Wird beim Start aus CLAMAV_FRESHCLAM_CHECKS gesetzt.
Checks 24

# Nach einer Aktualisierung laedt clamd die Signaturen neu, ohne Neustart.
NotifyClamd /etc/clamav/clamd.conf

# Auch die Bytecode-Signaturen (Skript-Schadcode) mitladen.
Bytecode yes

# Fehlversuche nicht sofort aufgeben (Netzwerk im Docker-Netz).
MaxAttempts 5
ConnectTimeout 30
ReceiveTimeout 60
