# Nextcloud unter dem echten Webroot /office (Same-Origin hinter dem
# auth-Container). Dadurch stimmen oeffentliche Pfade (/office/...) und
# interne Aufrufe des DocumentServers (http://nextcloud/office/...) ueberein.
Alias /office /var/www/html

# Der auth-Container setzt X-Remote-User ausschliesslich auf dem
# SSO-Einstiegspunkt von user_saml (NTLM). Nextcloud erwartet den reinen
# SamAccountName: "DOMAENE\name" bzw. "name@domaene" -> "name".
SetEnvIfNoCase X-Remote-User "^(?:[^\\]*\\)?([^@]+)" OFFICE_SSO_UID=$1

# Aufrufe der Wurzel des Containers auf den Webroot umleiten.
RedirectMatch 302 ^/$ /office/
