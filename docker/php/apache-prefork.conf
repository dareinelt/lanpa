# Grenze fuer die gleichzeitigen Anfragen des app-Containers (mod_php/prefork:
# ein Prozess je Anfrage). Ohne diese Datei gilt der Debian-Standard
# MaxRequestWorkers 150.
#
# Die Zahl muss zum Verbindungsbudget der Datenbank passen: jeder laufende
# Request oeffnet eine eigene PDO-Verbindung (app/Core/Database.php), es gibt
# kein Pooling. docker/mysql/my.cnf setzt max_connections = 240; davon gehen
# etwa 15 Verbindungen fuer die Nebenverbraucher ab (mail, mail-archive, sync,
# snmp, office-backup, phpmyadmin, Healthchecks, Root-Reserve), sodass fuer die
# Worker rund 220 zur Verfuegung stehen. Der Puffer deckt Lastspitzen ab.
#
# Nach oben begrenzt nicht die Verbindungszahl, sondern der Arbeitsspeicher des
# Hosts: jeder Worker belegt seinen tatsaechlichen RSS (nicht memory_limit) -
# bei 176 Workern also grob 176 x 60-80 MB. Vor einer Erhoehung daher
# "docker stats --no-stream app" unter Last pruefen und MaxRequestWorkers nur so
# weit anheben, wie die RAM-Reserve reicht. Details in docs/installation.md,
# Abschnitt "Dimensionierung".
#
# Die Anfrage wartet bei Erreichen der Grenze in der Warteschlange des
# Betriebssystems, statt mit HTTP 500 ("Too many connections") abzubrechen.
<IfModule mpm_prefork_module>
    StartServers             8
    MinSpareServers          8
    MaxSpareServers         16
    ServerLimit            176
    MaxRequestWorkers      176
    # Prozesse nach 10000 Anfragen neu starten: begrenzt schleichende
    # Speicherzunahme durch Erweiterungen, ohne haeufige Neustarts.
    MaxConnectionsPerChild 10000
</IfModule>
