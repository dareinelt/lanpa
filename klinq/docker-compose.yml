services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: assets-app
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      mysql:
        condition: service_healthy
      pdf:
        condition: service_started
      mail:
        condition: service_started
    volumes:
      - assets_uploads:/var/www/html/storage/uploads
      - assets_logs:/var/www/html/storage/logs
      - assets_labels:/var/www/html/storage/labels
    restart: unless-stopped

  # HTML→PDF (WeasyPrint) für Übergabeprotokolle; nur im internen Netz erreichbar
  pdf:
    build:
      context: .
      dockerfile: docker/pdf/Dockerfile
    container_name: assets-pdf
    expose:
      - "8000"
    restart: unless-stopped

  # E-Mail-Versand (SMTP-Relay) für Entnahme-/Retourennachweise und Übergabeprotokolle;
  # nur im internen Netz erreichbar, Anbindung an einen echten Mailserver über SMTP_*.
  mail:
    build:
      context: .
      dockerfile: docker/mail/Dockerfile
    container_name: assets-mail
    environment:
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10}
      SMTP_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      SMTP_FROM_NAME: ${MAIL_FROM_NAME:-}
    expose:
      - "8025"
    restart: unless-stopped

  # Kleines Sprachmodell (Ollama) für „Mit KI verbessern“ im Helpdesk – nur für Entwicklung/Tests.
  # Start: docker compose --profile ai up -d   (Endpunkt im Admin: http://ai:11434/v1)
  ai:
    image: ollama/ollama:latest
    container_name: assets-ai
    profiles: ["ai"]
    environment:
      OLLAMA_KEEP_ALIVE: ${AI_KEEP_ALIVE:-10m}
    volumes:
      - assets_ai:/root/.ollama
    ports:
      - "${AI_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  # Einmaliger Modell-Download, damit der Start mit dem Profil ohne Handarbeit auskommt.
  ai-model:
    image: ollama/ollama:latest
    container_name: assets-ai-model
    profiles: ["ai"]
    depends_on:
      ai:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ai:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${AI_MODEL:-qwen3.5:0.8b}"]
    restart: "no"

  mysql:
    image: mysql:8.4
    container_name: assets-mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - assets_db:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  assets_db:
  assets_uploads:
  assets_logs:
  assets_labels:
  assets_ai:
