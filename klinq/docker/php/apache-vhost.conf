<VirtualHost *:80>
    ServerAdmin admin@localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        Options -Indexes
        FallbackResource /index.php
    </Directory>

    # Service Worker und Manifest
    AddType application/manifest+json .webmanifest
    AddType text/javascript .js .mjs

    # Statische Assets: immer revalidieren (Cache-Busting via ?v=mtime), @import-Kinder eingeschlossen
    <FilesMatch "\.(css|js|mjs|svg|png|webmanifest)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    # Storage darf niemals direkt ausgeliefert werden
    <Directory /var/www/html/storage>
        Require all denied
    </Directory>

    # ---------------------------------------------------------------------
    # Einbindung unter dem Unterpfad des Intranets (KLINQ_BASE_PATH, z. B.
    # /klinq). Der Intranet-Proxy entfernt den Unterpfad vor der Anfrage;
    # KLINQ arbeitet deshalb durchgehend mit seinen eigenen Pfaden
    # (/dashboard, /api/..., /js/...). Fuer den Browser werden die
    # wurzelbezogenen Adressen in HTML-, CSS- und Manifest-Antworten sowie
    # im Location-Header ergaenzt.
    #
    # JavaScript wird bewusst NICHT ersetzt: die Ersetzung greift auch
    # innerhalb von Regex-Literalen wie .replace(/&/g, ...) oder
    # /\.(css|js)$/ und macht daraus ungueltige Ausdruecke
    # ("Invalid regular expression flags"). JavaScript ermittelt den
    # Unterpfad stattdessen selbst (window.AppUI.basePath/url(), sw.js BASE).
    #
    # KLINQ_BASE_PATH wird von docker/php/entrypoint.sh bereitgestellt. Ist
    # der Wert leer, bleibt alles unveraendert (KLINQ unter "/").
    # Ausgenommen sind protokollrelative Adressen ("//host/..."), die das
    # Praefix bewusst umgehen (z. B. das Designfarben-Stylesheet des
    # Intranets).
    # ---------------------------------------------------------------------
    <Location />
        # mod_filter (AddOutputFilterByType) laesst Filter bei Antworten mit einem
        # anderen Status als 200 aus (Apache-Doku, "Filtering and Response Status").
        # Ohne diese Variable liefert eine Fehlerseite (z. B. 500) ihre
        # wurzelbezogenen Adressen ohne Unterpfad aus: Der Browser laedt dann
        # /css/app.css aus der Intranet-Wurzel, bekommt dort HTML statt CSS und
        # zeigt die Fehlerseite ungestylt (zusaetzlich 404 fuer /js/ui.js und
        # /manifest.webmanifest). filter-errordocs hebt die Einschraenkung auf.
        SetEnv filter-errordocs 1
        AddOutputFilterByType SUBSTITUTE text/html text/css application/manifest+json
        # Kein "n"-Flag: es wuerde das Muster als feste Zeichenkette behandeln,
        # sodass der regulaere Ausdruck nie greift und alle wurzelbezogenen
        # Adressen ohne Unterpfad ausgeliefert werden (Seite ohne CSS/JS).
        # Rueckverweis als $1 (nicht \1: das ergaebe ein literales "1").
        # (?!>) schuetzt selbstschliessende Tags wie <path d="..."/>.
        # Die Zeichenklasse enthaelt "(" fuer url(/...) in CSS; in HTML und
        # JSON steht vor einer Adresse immer ein Anfuehrungszeichen.
        Substitute 's|(["\x27(])/(?!/)(?!>)|$1${KLINQ_BASE_PATH}/|i'
        # Weiterleitungen der Anwendung (Location: /dashboard)
        Header edit Location "^/(?!/)" "${KLINQ_BASE_PATH}/"
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>